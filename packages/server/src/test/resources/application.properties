spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# Use the lowest legal bcrypt cost in tests so the suite stays fast.
security.password.bcrypt-cost=4

# Deterministic JWT settings for tests (secret must be >= 32 bytes for HS256).
security.jwt.secret=test-only-jwt-signing-secret-0123456789abcdef
security.jwt.expiration=3600000
