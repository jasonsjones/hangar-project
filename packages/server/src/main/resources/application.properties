spring.datasource.url=jdbc:postgresql://localhost:5432/hanger_db
spring.datasource.username=plane_commander
spring.datasource.password=hanger_1000
spring.datasource.driver-class-name=org.postgresql.Driver

spring.sql.init.mode=always

# Bcrypt cost factor for password hashing.
# Dev default 10 (~100ms). Prod should override via env var SECURITY_PASSWORD_BCRYPT_COST=12 (~400ms, OWASP-recommended).
security.password.bcrypt-cost=10

# JWT signing secret and token lifetime.
# The secret must be >= 32 bytes for HS256. This dev default is NOT a secret —
# prod MUST override via env var SECURITY_JWT_SECRET with a random 256-bit value.
security.jwt.secret=dev-only-insecure-secret-change-me-in-production-0123456789
# Token lifetime in milliseconds (default 1 hour).
security.jwt.expiration=3600000
